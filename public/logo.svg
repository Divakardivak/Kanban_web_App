<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Indigo to Vibrant Purple -->
    <linearGradient id="flowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Glass Glow Overlay -->
    <linearGradient id="flowGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="flowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#flowBgGrad)" />
  <rect width="512" height="256" rx="120" fill="url(#flowGlowGrad)" />

  <!-- High-Tech Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Column 1 (Left - To Do) -->
  <g filter="url(#flowShadow)">
    <rect x="96" y="112" width="92" height="288" rx="18" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3" />
    <rect x="110" y="130" width="64" height="12" rx="6" fill="#F43F5E" />
    <rect x="108" y="156" width="68" height="64" rx="12" fill="#FFFFFF" />
    <rect x="108" y="232" width="68" height="78" rx="12" fill="#FFFFFF" />
    <rect x="108" y="322" width="68" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Column 2 (Middle - In Progress) -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="112" width="92" height="288" rx="18" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3" />
    <rect x="224" y="130" width="64" height="12" rx="6" fill="#F59E0B" />
    <rect x="222" y="156" width="68" height="96" rx="12" fill="#FFFFFF" />
    <rect x="222" y="264" width="68" height="74" rx="12" fill="#FFFFFF" />
  </g>

  <!-- Column 3 (Right - Done) -->
  <g filter="url(#flowShadow)">
    <rect x="324" y="112" width="92" height="288" rx="18" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3" />
    <rect x="338" y="130" width="64" height="12" rx="6" fill="#10B981" />
    <rect x="336" y="156" width="68" height="70" rx="12" fill="#FFFFFF" />
    <rect x="336" y="238" width="68" height="88" rx="12" fill="#FFFFFF" />
    <circle cx="370" cy="282" r="14" fill="#10B981" />
    <path d="M363 282 L368 287 L377 277" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>